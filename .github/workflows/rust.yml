name: Rust CI

on:
  push:
    branches: [main, llvm-backend, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-23 llvm-23-dev
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=/usr/lib/llvm-23/bin/llvm-config" >> "$GITHUB_ENV"
          echo "RAMLANG_CLANG=clang-23" >> "$GITHUB_ENV"
      - name: Format check
        run: cargo fmt --manifest-path runtime/Cargo.toml -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy -p ramlang-runtime --all-targets -- -D warnings
