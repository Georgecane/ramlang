name: Rust CI

on:
  push:
    branches: [main, llvm-backend, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install LLVM and Clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Format check
        run: cargo fmt --manifest-path runtime/Cargo.toml -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy -p ramlang-runtime --all-targets -- -D warnings
