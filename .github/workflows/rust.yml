name: Rust CI

on:
  push:
    branches: [main, llvm-backend, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm llvm-dev libpolly-18-dev lld-18
          LLVM_CONFIG="$(command -v llvm-config-18 || command -v llvm-config)"
          LLVM_VERSION="$("$LLVM_CONFIG" --version)"
          test "${LLVM_VERSION%%.*}" = "18"
          echo "LLVM_CONFIG_PATH=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "LLVM_SYS_181_PREFIX=$("$LLVM_CONFIG" --prefix)" >> "$GITHUB_ENV"
          LLVM_BINDIR="$("$LLVM_CONFIG" --bindir)"
          echo "LLVM_BINDIR=$LLVM_BINDIR" >> "$GITHUB_ENV"
          echo "RAMLANG_LLD=$LLVM_BINDIR/ld.lld" >> "$GITHUB_ENV"
      - name: Format check
        run: cargo fmt --manifest-path runtime/Cargo.toml -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy -p ramlang-runtime --all-targets -- -D warnings
