name: Rust CI

on:
  push:
    branches: [main, llvm-backend, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm llvm-dev
          LLVM_CONFIG="$(command -v llvm-config-23 || command -v llvm-config)"
          LLVM_VERSION="$("$LLVM_CONFIG" --version)"
          echo "LLVM_CONFIG_PATH=$LLVM_CONFIG" >> "$GITHUB_ENV"
          echo "LLVM_SYS_231_PREFIX=$("$LLVM_CONFIG" --prefix)" >> "$GITHUB_ENV"
          echo "RAMLANG_CLANG=clang" >> "$GITHUB_ENV"
          test "${LLVM_VERSION%%.*}" = "23"
      - name: Format check
        run: cargo fmt --manifest-path runtime/Cargo.toml -- --check
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy -p ramlang-runtime --all-targets -- -D warnings
