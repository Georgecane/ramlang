        run: |
          cargo run --release -- examples/calloc_realloc.ram --emit-llvm target/calloc-realloc-i386.ll --target i386-unknown-linux-gnu
          grep -Fq 'target triple = "i386-unknown-linux-gnu"' target/calloc-realloc-i386.ll
          grep -Fq 'declare ptr @ramlang_calloc(i32, i32)' target/calloc-realloc-i386.ll
          grep -Fq 'declare i32 @ramlang_strlen(ptr)' target/calloc-realloc-i386.ll
